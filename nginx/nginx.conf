upstream terminal_dashboard {
    server terminal-dashboard:3000;
}

upstream tmux_session_service {
    server tmux-session-service:5001;
}

upstream youtube_transcribe_service {
    server youtube-transcribe-service:5005;
}

upstream codex_control_service {
    server unix:/run/codex-control/control.sock;
}

# The shared app-server listens only on the host-side gateway of this Compose
# network. Remote clients reach it exclusively through the authenticated TLS
# listener on port 4501.
upstream codex_app_server {
    server 192.168.160.1:4500;
}

# Docker's embedded DNS tracks Compose service IPs after containers are
# recreated. Resolve this upstream at runtime so nginx does not keep routing to
# the IP that agent-history-service had when nginx started.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream agent_history_api {
    zone agent_history_api 64k;
    server agent-history-service:5002 resolve;
}

# Whisper API upstream (uncomment when whisper service is enabled)
# upstream whisper_api {
#     server whisper-realtime-api:8000;
# }

server {
    listen 80;
    server_name _;

    # Keep Docker healthchecks on plain HTTP so self-signed HTTPS certs do not
    # make a healthy proxy look unhealthy.
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificate paths (self-signed for development, replace with Let's Encrypt in production)
    ssl_certificate /etc/nginx/ssl/certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/certificate.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Main React app
    location / {
        proxy_pass http://terminal_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Whisper transcription proxy (remote GPU host)
    location /api/whisper/ {
        proxy_pass http://10.1.1.218:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YouTube transcription service (longest-prefix match wins over /api/)
    location /api/transcribe/ {
        proxy_pass http://youtube_transcribe_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # Agent History API for the native dashboard view.
    location /api/agent-history/ {
        proxy_pass http://agent_history_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Host-side Codex app-server application layer. The service itself binds
    # only a Unix socket; this HTTPS route exposes it to trusted dashboard clients.
    location /api/codex/ {
        proxy_pass http://codex_control_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # TMux session service API (REST endpoints) - catchall for /api/sessions/*
    location /api/ {
        proxy_pass http://tmux_session_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket bridge for interactive terminals
    location /ws/sessions/ {
        proxy_pass http://tmux_session_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket bridge for remote host tmux sessions
    location /ws/remote-sessions/ {
        proxy_pass http://tmux_session_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Whisper API (optional - uncomment when whisper service is enabled)
    # location /api/whisper/ {
    #     proxy_pass http://whisper_api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # WebSocket support for real-time transcription
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Dedicated root-path WebSocket endpoint for `codex --remote`. Keeping this on
# its own port avoids exposing the dashboard's HTTP routes as app-server RPCs.
server {
    listen 4501 ssl;
    server_name _;

    ssl_certificate /run/codex-remote-tls/server.crt;
    ssl_certificate_key /run/codex-remote-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:CODEX_REMOTE:10m;
    ssl_session_timeout 10m;

    location = /readyz {
        access_log off;
        proxy_pass http://codex_app_server/readyz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://codex_app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
