[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-plane-intake"
version = "0.1.0"
description = "Secure Slack problem intake for Hermes Agent and Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "Pillow>=11,<13",
  "pydantic>=2.11,<3",
  "PyMuPDF>=1.26,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
slack-plane-intake = "slack_plane_intake.mcp_server:main"
slack-plane-intake-provision = "slack_plane_intake.provision:main"
slack-plane-intake-shortcut = "slack_plane_intake.shortcut_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
